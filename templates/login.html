<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noxel ID // Authorization</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08); --text: #ffffff; --muted: #888888;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: clamp(20px, 5vw, 40px); display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 70%);
        }
        .login-wrapper {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            padding: clamp(30px, 6vw, 48px); width: 100%; max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        
        .logo-header { display: flex; justify-content: center; margin-bottom: 32px; }
        .logo-tag { font-weight: 800; letter-spacing: -0.01em; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 1.2rem; }
        .logo-tag::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #fff; border-radius: 50%; }

        .auth-tabs { display: flex; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 4px; margin-bottom: 32px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; text-align: center; background: transparent; border: none; color: var(--muted); font-weight: 600; font-family: inherit; font-size: 0.9rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--text); color: var(--bg); box-shadow: 0 4px 10px rgba(255,255,255,0.1); }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: var(--text); border-radius: 12px; outline: none; transition: border-color 0.2s;
            font-size: 16px; padding: 16px; font-family: inherit;
        }
        .form-group input:focus { border-color: rgba(255,255,255,0.4); }
        
        .checkbox-group { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; font-size: 0.82rem; color: var(--muted); text-align: left; line-height: 1.4; }
        .checkbox-group input { accent-color: #fff; width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
        .checkbox-group a { color: var(--text); text-decoration: underline; }

        .register-fields { display: none; }
        .register-fields.show { display: block; }

        .btn-submit {
            width: 100%; background: #ffffff; color: #000000; border: none; 
            padding: 18px; font-size: 1rem; font-weight: 700; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1); transition: all 0.2s ease; margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15); }
        
        .flash-messages { list-style: none; padding: 16px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; margin: 0 0 24px 0; font-size: 0.85rem; color: #ef4444; font-weight: 600; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 24px; color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-header"><span class="logo-tag">NOXEL ID</span></div>
        
        <div class="auth-tabs">
            <button type="button" id="tab-login" class="tab-btn active" onclick="switchAuth('login')">Sign In</button>
            <button type="button" id="tab-register" class="tab-btn" onclick="switchAuth('register')">Create ID</button>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="action" id="form-action" value="login">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <!-- REGISTRATION SPECIFIC OPTIONS -->
            <div id="register-options" class="register-fields">
                <div class="checkbox-group">
                    <input type="checkbox" id="policy" name="policy">
                    <label for="policy" style="display:inline; color:var(--muted); font-weight:normal; margin:0;">I agree to the Noxel Studio Terms of Service and Privacy Policy.</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="marketing" name="marketing" checked>
                    <label for="marketing" style="display:inline; color:var(--muted); font-weight:normal; margin:0;">Send me daily product drops, exclusive promos, and updates via email.</label>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">Access Interface</button>
        </form>
        
        <a href="/" class="back-link">← Return to Store</a>
    </div>

    <script>
        function switchAuth(mode) {
            document.getElementById('form-action').value = mode;
            const regFields = document.getElementById('register-options');
            const policyBox = document.getElementById('policy');

            if (mode === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('btn-submit').innerText = "Access Interface";
                regFields.classList.remove('show');
                policyBox.required = false;
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('btn-submit').innerText = "Initialize Noxel ID";
                regFields.classList.add('show');
                policyBox.required = true;
            }
        }
    </script>
</body>
</html>
