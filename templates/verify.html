<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify // NOXEL ID</title>

    <!-- ENTERPRISE SEO & GOOGLE INDEXING METADATA -->
    <meta name="description" content="Noxel Studio offers uncompromised visual packs, high-end desktop and mobile wallpapers for minimalist setups and professional workstations.">
    <meta name="keywords" content="Noxel Studio, noxlestudio, noxelstudio.dev, digital assets, desktop wallpapers, mobile wallpapers, minimalist setup">
    <meta name="author" content="Noxel Studio">
    <meta name="robots" content="index, follow">
    
    <!-- OPEN GRAPH / GOOGLE RICH RESULTS -->
    <meta property="og:title" content="NOXEL STUDIO // Premium Digital Assets">
    <meta property="og:description" content="Uncompromised visual packs for high-end hardware and minimalist setups.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.noxelstudio.dev">
    <meta property="og:site_name" content="Noxel Studio">

    <!-- TWITTER / SOCIAL CARDS -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NOXEL STUDIO // Digital Assets">
    <meta name="twitter:description" content="High-fidelity assets for professional workstations and minimalist setups.">


    <!-- NOXEL STUDIO FAVICONS -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><path d='M30 70 V30 L70 70 V30' stroke='%23fff' stroke-width='10' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><path d='M30 70 V30 L70 70 V30' stroke='%23fff' stroke-width='10' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --surface: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08); --text: #ffffff; --muted: #888888;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: clamp(20px, 5vw, 40px); display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 70%);
        }
        .login-wrapper {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            padding: clamp(30px, 6vw, 48px); width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        
        .logo-header { display: flex; justify-content: center; margin-bottom: 32px; }
        .logo-tag { font-weight: 800; letter-spacing: -0.01em; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 1.2rem; }
        .logo-tag::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #fff; border-radius: 50%; }

        h2 { font-size: 1.8rem; margin: 0 0 12px 0; font-weight: 700; letter-spacing: -0.02em; }
        p.subtitle { color: var(--muted); font-size: 0.95rem; margin: 0 0 32px 0; line-height: 1.5; }
        p.subtitle span { color: #fff; font-weight: 600; }
        
        .form-group { margin-bottom: 24px; text-align: left; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: var(--text); border-radius: 12px; outline: none; transition: border-color 0.2s;
            font-size: 24px; padding: 16px; font-family: 'JetBrains Mono', monospace; text-align: center; letter-spacing: 0.2em;
        }
        .form-group input:focus { border-color: rgba(255,255,255,0.4); }
        
        .btn-submit {
            width: 100%; background: #ffffff; color: #000000; border: none; 
            padding: 18px; font-size: 1rem; font-weight: 700; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1); transition: all 0.2s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15); }
        
        .flash-messages { list-style: none; padding: 16px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; margin: 0 0 24px 0; font-size: 0.85rem; color: #ef4444; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-header"><span class="logo-tag">NOXEL ID</span></div>
        
        <h2>Identity Verification</h2>
        <p class="subtitle">Enter the 6-digit access code sent to <br><span>{{ email }}</span></p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="code" placeholder="000000" maxlength="6" pattern="\d{6}" required autocomplete="off">
            </div>
            <button type="submit" class="btn-submit">Verify & Access</button>
        </form>
    </div>
</body>
</html>
